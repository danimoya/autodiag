# AutoDiag testbed: Oracle Database Free with ssh access as the oracle user.
# Copy .env.example to .env first. Loopback-only ports.
services:
  oradb:
    build:
      context: .
      args:
        BASE_IMAGE: ${AUTODIAG_ORACLE_BASE_IMAGE:-container-registry.oracle.com/database/free:23.26.3.0}
    image: autodiag-oradb:23ai
    container_name: autodiag-oradb
    hostname: oradb-test
    shm_size: "4g"
    mem_limit: 8g
    env_file: .env
    environment:
      ENABLE_ARCHIVELOG: "true"
    ports:
      - "127.0.0.1:1521:1521"
      - "127.0.0.1:2222:2222"
    volumes:
      - oradata:/opt/oracle/oradata
      - sshdstate:/home/oracle/sshd
      - ${AUTODIAG_SSH_PUBKEY:-~/.ssh/id_ed25519.pub}:/autodiag/authorized_keys:ro
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: unless-stopped

volumes:
  oradata:
  sshdstate:
