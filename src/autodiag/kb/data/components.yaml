# Oracle kernel function-name prefixes -> layer / component. Longest prefix wins.
# Used to label call-stack frames and to explain where two stacks diverge.
prefixes:
  kgl: "library cache"
  kglic: "library cache iterator"
  kks: "shared cursors / cursor management"
  kxs: "SQL execution (kernel execution)"
  qer: "row source execution"
  qeril: "row source: index lookup"
  qerix: "row source: index scan"
  qergs: "row source: group by sort"
  qertb: "row source: table access"
  qerhj: "row source: hash join"
  qernl: "row source: nested loops"
  qei: "row source: index"
  kdx: "index block layer (B-tree)"
  kdi: "index layer"
  kdt: "data layer: table insert"
  kdu: "data layer: table update"
  kdd: "data layer: table delete"
  kdr: "data layer: row fetch"
  kdc: "data layer: chained rows"
  kcb: "buffer cache"
  kcbz: "buffer cache: physical I/O"
  kcr: "redo"
  kcrf: "redo: log writer"
  kcl: "cache fusion (RAC)"
  kjb: "RAC: global cache (GCS)"
  kjc: "RAC: cluster communication"
  kjx: "RAC: lock manager"
  kjm: "RAC: lock manager daemon"
  kfk: "ASM: file I/O"
  kfd: "ASM: disk"
  kfio: "ASM: I/O"
  ksl: "latches / waits"
  ksq: "enqueues"
  kss: "state objects"
  ksu: "process / session management"
  ksb: "background processes"
  ksm: "memory (SGA)"
  kgh: "heap manager"
  ksf: "file I/O (server)"
  kcf: "file management"
  ktu: "undo / transactions"
  ktb: "transaction block layer"
  ktc: "transaction control"
  ksp: "parameters"
  kql: "dictionary (library cache objects)"
  kqd: "dictionary cache"
  kqr: "row cache"
  qcs: "parser: semantic analysis"
  qcp: "parser"
  qco: "parser: object resolution"
  opi: "Oracle program interface (call dispatch)"
  ttc: "two-task common (network protocol)"
  nsp: "network: session"
  nsb: "network: buffer"
  ns: "network layer"
  nt: "network transport"
  pev: "PL/SQL virtual machine"
  pfr: "PL/SQL frame"
  pen: "PL/SQL engine"
  psd: "PL/SQL: SQL dispatcher"
  pl: "PL/SQL"
  kxf: "parallel execution"
  kxfp: "parallel execution: process"
  kxfx: "parallel execution: execution"
  kzs: "security: sessions"
  kza: "auditing"
  krv: "recovery / redo apply"
  krb: "RMAN backup"
  kok: "object support"
  koh: "object heap"
  kol: "LOB layer"
  kou: "object types"
  kgg: "generic: string / general"
  kge: "error handling"
  kgi: "instantiation"
  dbk: "diagnostics (DDE)"
  dbg: "diagnostics"
  ksd: "diagnostic dump"
  kse: "error stack / dump"
  skg: "OS dependent layer"
  ssk: "OS dependent layer (Linux)"
  ss: "OS dependent layer"
  sl: "OS dependent layer"
  ksfd: "file I/O: disk"
  kcv: "control file / checkpoint"
  kct: "checkpoint"
  kcc: "control file"
  kcm: "SCN management"
  kcs: "SCN / commit"
  ksz: "PDB / container management"
  kpdb: "pluggable databases"
